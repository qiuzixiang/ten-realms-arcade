<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-game="eclipse-watch" data-level-id="first-umbra" data-state="action" data-action="mark:2:1" data-before-mark="-1" data-after-mark="1" data-focus-clue="12" data-source="range">
  <title id="title">初蚀光幕的一次真实黑影操作</title>
  <desc id="desc">在首关内部格二放置黑影。它位于读数灯十二的正上方同一列，令该灯的实时可见数由九缩为八。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0c1430"/><stop offset="1" stop-color="#4a3774"/></linearGradient><style>.u{fill:#1b2c5a;stroke:#b9daff;stroke-opacity:.35}.b{fill:#090a13;stroke:#8c92ad;stroke-width:2}.c{fill:#b8edf8;stroke:#fff0b9;stroke-width:2}.n{fill:#17294c;font:700 22px Georgia,serif;text-anchor:middle}.copy{fill:#d8e3f6;font:600 15px sans-serif}.tag{fill:#aac4fa;font:700 12px sans-serif;letter-spacing:1px}</style></defs>
  <rect width="640" height="360" rx="25" fill="url(#bg)"/>
  <text x="32" y="42" class="tag">真实操作 · mark:2:1</text><text x="32" y="77" fill="#fff2da" font-family="Georgia,serif" font-size="27" font-weight="700">在光路上放置黑影</text>
  <g transform="translate(34 112)"><rect width="156" height="115" rx="18" fill="#09102a" stroke="#b9dfff" stroke-opacity=".4"/><text x="78" y="30" class="tag" text-anchor="middle">操作前</text><rect x="54" y="44" width="48" height="48" rx="10" class="u"/><text x="78" y="77" fill="#9fb7e5" font-family="Georgia,serif" font-size="29" text-anchor="middle">+</text><text x="78" y="106" fill="#a9bce4" font-family="sans-serif" font-size="11" text-anchor="middle">未知，不截光</text></g>
  <path d="M210 170 H274" stroke="#ffe69c" stroke-width="5" stroke-linecap="round"/><path d="M265 159 L281 170 L265 181" fill="none" stroke="#ffe69c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(294 112)"><rect width="156" height="115" rx="18" fill="#09102a" stroke="#ffe69c" stroke-width="2"/><text x="78" y="30" class="tag" text-anchor="middle">操作后</text><rect x="54" y="44" width="48" height="48" rx="10" class="b"/><circle cx="78" cy="68" r="13" fill="#05050d" stroke="#8188a3" stroke-width="2"/><text x="78" y="106" fill="#d5f7ff" font-family="sans-serif" font-size="11" text-anchor="middle">黑影，截断光束</text></g>
  <g transform="translate(498 51)" aria-label="读数灯十二的真实光束变化"><text x="52" y="12" class="tag" text-anchor="middle">读数灯 12 的上方光路</text><rect x="5" y="27" width="94" height="247" rx="15" fill="#071027" stroke="#b9ddff" stroke-opacity=".45"/><rect x="28" y="42" width="48" height="48" rx="8" class="b"/><rect x="28" y="98" width="48" height="48" rx="8" class="u"/><rect x="28" y="154" width="48" height="48" rx="8" class="c"/><text x="52" y="185" class="n">5</text><path d="M52 151 V111" stroke="#c5f8ff" stroke-width="5" stroke-linecap="round"/><path d="M52 94 V90" stroke="#ff758d" stroke-width="5" stroke-linecap="round"/><text x="52" y="226" fill="#d6faff" font-family="sans-serif" font-size="11" text-anchor="middle">实时读数</text><text x="52" y="248" fill="#ffe59d" font-family="Georgia,serif" font-size="22" font-weight="700" text-anchor="middle">8 / 5</text></g>
  <text x="32" y="271" class="copy">黑影只会让经过它的上下左右光束停止；黑影之间不能共享一条边。</text><text x="32" y="302" class="copy">点击任一读数灯可切换高亮的真实光束；右键或触控工具可循环三种标记。</text><text x="32" y="334" fill="#aebfdf" font-family="sans-serif" font-size="12">白点笔记不截断光，也不改变胜利判断。</text>
</svg>
