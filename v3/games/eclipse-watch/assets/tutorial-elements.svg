<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-game="eclipse-watch" data-level-id="first-umbra" data-state="initial" data-board-size="5x5" data-source="range">
  <title id="title">初蚀光幕的真实初始状态</title>
  <desc id="desc">5乘5棋盘显示十盏固定白色读数灯和十五个未知格。读数灯显示的数字表示可见白格数。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0a1230"/><stop offset="1" stop-color="#293c75"/></linearGradient><style>.u{fill:#172957;stroke:#bcd8ff;stroke-opacity:.27}.c{fill:#b9edf8;stroke:#fff3be;stroke-width:2}.n{fill:#17274c;font:700 21px Georgia,serif;text-anchor:middle}.s{fill:#aec4fa;font:700 12px sans-serif;letter-spacing:2px}.p{fill:#d3def4;font:600 15px sans-serif}</style></defs>
  <rect width="640" height="360" rx="25" fill="url(#bg)"/>
  <text x="32" y="43" class="s">真实首关 · 初始状态</text><text x="32" y="77" fill="#fff3d8" font-family="Georgia,serif" font-size="26" font-weight="700">初蚀光幕</text>
  <text x="32" y="125" class="p">数字灯永远是白格，</text><text x="32" y="151" class="p">它本身也要算进读数。</text><path d="M208 143 C250 143 277 139 305 139" fill="none" stroke="#ffe79d" stroke-width="3"/><circle cx="305" cy="139" r="5" fill="#ffe79d"/>
  <text x="32" y="227" class="p">未知格可标黑影、</text><text x="32" y="253" class="p">白点笔记，或保持未知。</text><path d="M232 244 C264 244 282 256 310 256" fill="none" stroke="#b9f5ff" stroke-width="3"/><circle cx="310" cy="256" r="5" fill="#b9f5ff"/>
  <g aria-label="5乘5真实初始棋盘"><rect x="304" y="48" width="266" height="266" rx="17" fill="#08112b" stroke="#b9dcff" stroke-opacity=".48" stroke-width="2"/>
    <g class="u"><rect x="312" y="56" width="46" height="46" rx="8"/><rect x="362" y="56" width="46" height="46" rx="8"/><rect x="412" y="56" width="46" height="46" rx="8"/><rect x="462" y="56" width="46" height="46" rx="8"/><rect x="512" y="56" width="46" height="46" rx="8"/><rect x="312" y="106" width="46" height="46" rx="8"/><rect x="362" y="106" width="46" height="46" rx="8"/><rect x="412" y="106" width="46" height="46" rx="8"/><rect x="462" y="106" width="46" height="46" rx="8"/><rect x="512" y="106" width="46" height="46" rx="8"/><rect x="312" y="156" width="46" height="46" rx="8"/><rect x="362" y="156" width="46" height="46" rx="8"/><rect x="412" y="156" width="46" height="46" rx="8"/><rect x="462" y="156" width="46" height="46" rx="8"/><rect x="512" y="156" width="46" height="46" rx="8"/><rect x="312" y="206" width="46" height="46" rx="8"/><rect x="362" y="206" width="46" height="46" rx="8"/><rect x="412" y="206" width="46" height="46" rx="8"/><rect x="462" y="206" width="46" height="46" rx="8"/><rect x="512" y="206" width="46" height="46" rx="8"/><rect x="312" y="256" width="46" height="46" rx="8"/><rect x="362" y="256" width="46" height="46" rx="8"/><rect x="412" y="256" width="46" height="46" rx="8"/><rect x="462" y="256" width="46" height="46" rx="8"/><rect x="512" y="256" width="46" height="46" rx="8"/></g>
    <g class="c"><rect x="362" y="106" width="46" height="46" rx="8"/><rect x="512" y="106" width="46" height="46" rx="8"/><rect x="312" y="156" width="46" height="46" rx="8"/><rect x="412" y="156" width="46" height="46" rx="8"/><rect x="462" y="156" width="46" height="46" rx="8"/><rect x="512" y="206" width="46" height="46" rx="8"/><rect x="312" y="256" width="46" height="46" rx="8"/><rect x="362" y="256" width="46" height="46" rx="8"/><rect x="462" y="256" width="46" height="46" rx="8"/><rect x="512" y="256" width="46" height="46" rx="8"/></g>
    <g class="n"><text x="385" y="136">5</text><text x="535" y="136">4</text><text x="335" y="186">3</text><text x="435" y="186">5</text><text x="485" y="186">4</text><text x="535" y="236">2</text><text x="335" y="286">7</text><text x="385" y="286">6</text><text x="485" y="286">5</text><text x="535" y="286">6</text></g>
  </g><text x="312" y="339" fill="#aec5e5" font-family="sans-serif" font-size="12">先点击任一读数灯，棋盘会高亮它此刻真实能看见的白格。</text>
