<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc"><title id="title">四时·山河合卷</title><desc id="desc">青绿、杏黄、赭红与黛蓝汇入横展的山河长卷，留白河流穿过层层山色，四碟染料陈列在卷前。装饰性章节插画。</desc><defs>
 <pattern id="paper" width="31" height="27" patternUnits="userSpaceOnUse"><path d="M3 7h7m13 12h5" stroke="#c8bba5" stroke-width=".6" opacity=".35"/></pattern>
 <pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M.5 0v5M0 .5h5" stroke="#f2ecdf" stroke-width=".4" opacity=".16"/></pattern>
 <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7ad68"/><stop offset="1" stop-color="#c8bba5"/></linearGradient>
 <linearGradient id="roller" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8bba5"/><stop offset=".28" stop-color="#f2ecdf"/><stop offset=".72" stop-color="#ecd9cd"/><stop offset="1" stop-color="#c8bba5"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#254c49" flood-opacity=".1"/></filter>
</defs><rect width="480" height="240" fill="#f2ecdf"/><rect width="480" height="240" fill="url(#paper)"/>
