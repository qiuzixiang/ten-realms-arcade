  <title id="title">四季染旅·东方染织工坊</title>
  <desc id="desc">木轴悬着一匹层染山水纹织物，周围放着三只陶瓷染碟、折叠布样与线轴，枝叶从右侧伸入。此为装饰插画。</desc>
