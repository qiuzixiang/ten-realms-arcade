<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc"><title id="title">暮春·溪桥晾绸</title><desc id="desc">清浅溪流穿过弧形石桥，三幅层染丝绸在木桩间晾晒，岸边花枝与细草相伴。装饰性章节插画。</desc><defs>
