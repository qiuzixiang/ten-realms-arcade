<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e8"><title>滚滚小镇 · 把小日子滚成大世界</title><link rel="stylesheet" href="./style.css"></head><body><main id="game"><canvas id="scene" aria-label="滚动收集的三维玩具小镇"></canvas><div class="vignette"></div><header id="hud" hidden><div class="topline"><span class="eyebrow" id="areaLabel"></span><button id="pause" class="icon" aria-label="暂停">Ⅱ</button></div><div class="size"><strong id="diameter">5.0</strong><span id="unit">cm</span><span class="size-label">小小的，也很了不起</span></div><div class="progress"><i id="growth"></i><b></b><b></b></div><div class="goalrow"><span id="goalLabel"></span><span id="counter"></span></div></header><div id="hint" hidden><span id="hintIcon">✦</span><div><small id="hintTitle">下一份小惊喜</small><p id="hintText"></p></div><button id="skip" aria-label="跳过引导">跳过</button></div><div id="toast" role="status"></div><div id="controls" hidden><div class="joystick" id="stick"><span class="arrows">↑<br>← &nbsp; →<br>↓</span><i id="knob"></i></div><div class="control-label">拖动这里 · 松手停下</div><button id="recenter" class="round" aria-label="镜头回正">◎</button><button id="finish" class="finish" hidden>收好这一程 ↗</button></div><section id="panel"></section><div id="fatal" hidden></div></main><script type="module" src="./app.mjs"></script></body></html>
