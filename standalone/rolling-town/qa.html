<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>滚滚小镇 · 场景验收</title><style>body{margin:0;background:#f4f0e3;color:#355542;font:13px sans-serif}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;left:12px;top:12px;right:12px;background:#fffde9eb;border-radius:15px;padding:14px}button{background:#43674f;color:#fff9eb;border:0;padding:10px;border-radius:8px;margin:4px}p{margin:6px}</style><canvas id="scene"></canvas><aside><button id="a">阳光书桌</button><button id="b">午后庭院</button><button id="c">奶油街区</button><button id="play">运行真实移动验收</button><p id="status">准备</p></aside><script type="module">
import {View} from './view.mjs';import{createWorld,freshRun,SpatialGrid,radius,moveAndCollect,tasks}from'./core.mjs';
const v=new View(document.querySelector('canvas'));let r,w,g,auto=false,frames=0,start=performance.now(),last=0,steps=0;function init(a){r=freshRun(a);w=createWorld(a);g=new SpatialGrid(w);v.build(a,w);v.camera.position.set(9,18,15);auto=false;steps=0;}init(0);document.querySelector('#a').onclick=()=>init(0);document.querySelector('#b').onclick=()=>init(1);document.querySelector('#c').onclick=()=>init(2);document.querySelector('#play').onclick=()=>auto=true;function loop(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;let target;if(auto){for(let i=0;i<8&&r.collected.length<216;i++){target=w.filter(o=>!r.collected.includes(o.id)&&o.need<=radius(r.volume)).sort((a,b)=>Math.hypot(a.x-r.x,a.z-r.z)-Math.hypot(b.x-r.x,b.z-r.z))[0];if(!target)break;const dx=target.x-r.x,dz=target.z-r.z,d=Math.hypot(dx,dz);const result=moveAndCollect(r,w,g,dx/d*.08,dz/d*.08);for(const o of result.collected)v.attach(o.id,radius(r.volume));steps++;}if(r.collected.length===216)auto=false;}v.update(r,dt,false,false,target);frames++;document.querySelector('#status').textContent=`区域 ${r.area+1} · ${r.collected.length}/216 件 · 半径 ${radius(r.volume).toFixed(2)} · 目标 ${tasks(r,w).join('/')} · ${v.renderer.info.render.calls} 次绘制 · ${Math.round(frames*1000/(t-start))} FPS · ${steps} 移动步`;requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
