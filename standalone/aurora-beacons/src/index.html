<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10252f"><title>极光信标</title><link rel="stylesheet" href="./styles.css"></head><body>
<div class="sky" aria-hidden="true"></div><main id="app">
<header><div><small>AURORA FIELD STATION · 01</small><h1>极光信标<span>极夜里的逻辑微光</span></h1></div><button id="tutorial" class="round" aria-label="重看教程">?</button></header>
<section class="landscape" aria-label="极地站点"><div class="aurora"></div><div class="mountain m1"></div><div class="mountain m2"></div><div class="station"><i></i><b>＋</b><b>−</b></div><div class="land-caption"><span id="stationName">01 · 初光哨所</span><small id="collection">已点亮 0 / 6 座站点</small></div></section>
<nav><button id="levels">航线 · 60关</button><button id="daily">每日调试</button><button id="archive">站点收藏</button></nav>
<section class="game"><div class="level-head"><div><small id="phase"></small><h2 id="levelTitle"></h2></div><span id="progress"></span></div><p id="lesson" class="lesson"></p><div class="board" id="board"></div><div class="legend"><span>上 / 左 ＋ 配额</span><span>下 / 右 − 配额</span><span>· 无线索</span></div>
<div class="slot-picker"><button id="prevSlot" aria-label="上一个信标">‹</button><p id="selection" class="selection"></p><button id="nextSlot" aria-label="下一个信标">›</button></div><div class="polarity"><button data-value="1" class="warm">＋ → −</button><button data-value="-1" class="cool">− → ＋</button><button data-value="0">○ 中性</button><button data-value="null">清空</button></div><div class="utilities"><button id="undo">↶ 撤销</button><button id="note">✧ 笔记</button><button id="hint">查看提示</button><button id="restart">重开</button></div><p id="status" role="status" aria-live="polite"></p><button id="next" class="primary" hidden>前往下一处信标 →</button></section>
<footer>不计时，慢慢推理。<button id="about">规则与来源</button><small>离线保存 · v1.0.0</small></footer></main>
<div id="modal" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="close" aria-label="关闭弹窗">×</button></div><div id="dialogBody"></div><div id="dialogActions"></div></section></div>
<script src="./engine.js"></script><script src="./oracle.js"></script><script src="./levels.js"></script><script src="./session.js"></script><script src="./renderer.js"></script><script src="./app.js"></script></body></html>
