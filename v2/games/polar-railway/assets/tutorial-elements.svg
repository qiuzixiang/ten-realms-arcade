<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 184" preserveAspectRatio="xMidYMid meet" role="img" aria-label="极地蒸汽列车棋盘元素：起点 A、终点 B、行列配额、固定轨型、候选格、排除标记和共享边轨道">
  <title>认识极地铁路的棋盘元素</title>
  <defs>
    <linearGradient id="elements-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102c45"/>
      <stop offset="1" stop-color="#071723"/>
    </linearGradient>
    <filter id="elements-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="320" height="184" rx="18" fill="url(#elements-sky)"/>
  <path d="M0 153 Q48 132 94 151 T191 150 T320 145 V184 H0Z" fill="#d9edf2" opacity=".13"/>
  <g fill="#bcecff" opacity=".38">
    <circle cx="18" cy="19" r="1.5"/><circle cx="39" cy="15" r="1"/><circle cx="171" cy="18" r="1.4"/>
    <circle cx="289" cy="25" r="1.6"/><circle cx="304" cy="91" r="1"/><circle cx="16" cy="127" r="1.2"/>
  </g>

  <text x="18" y="20" fill="#eefcff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1">01 · 识别调度图</text>

  <!-- Column quotas -->
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
    <g fill="#dff7ff"><circle cx="60.5" cy="31" r="9" fill="#21465f"/><text x="60.5" y="34.5">2</text></g>
    <g fill="#dff7ff"><circle cx="85.5" cy="31" r="9" fill="#21465f"/><text x="85.5" y="34.5">3</text></g>
    <g fill="#dff7ff"><circle cx="110.5" cy="31" r="9" fill="#21465f"/><text x="110.5" y="34.5">2</text></g>
    <g fill="#dff7ff"><circle cx="135.5" cy="31" r="9" fill="#21465f"/><text x="135.5" y="34.5">1</text></g>
  </g>

  <!-- Four-by-four board -->
  <rect x="48" y="42" width="100" height="100" rx="5" fill="#e8f6f7" stroke="#91c7d4" stroke-width="2"/>
  <path d="M73 42V142M98 42V142M123 42V142M48 67H148M48 92H148M48 117H148" fill="none" stroke="#6e9fad" stroke-width="1"/>

  <!-- A enters from the left into a fixed curve -->
  <g font-family="system-ui, sans-serif" font-weight="900">
    <rect x="19" y="69.5" width="21" height="20" rx="10" fill="#f4b942"/>
    <text x="29.5" y="83.5" text-anchor="middle" font-size="12" fill="#17212a">A</text>
  </g>
  <path d="M40 79.5H60.5V67" fill="none" stroke="#202d36" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 79.5H60.5V67" fill="none" stroke="#e4fbff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="52.5" y="70.5" width="16" height="16" rx="4" fill="#1b7899" fill-opacity=".3" stroke="#157d9e"/>
  <path d="M60.5 73V84M55 78.5H66" stroke="#e9fcff" stroke-width="1.5"/>
  <circle cx="60.5" cy="78.5" r="2.2" fill="#f4b942"/>

  <!-- Candidate cell -->
  <rect x="99.5" y="43.5" width="22" height="22" rx="4" fill="#82d9e7" fill-opacity=".28" stroke="#157d9e" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="110.5" cy="54.5" r="3.4" fill="none" stroke="#157d9e" stroke-width="1.5" stroke-dasharray="2 1"/>

  <!-- Track crossing one shared cell edge -->
  <path d="M85.5 104.5H110.5" fill="none" stroke="#26343d" stroke-width="8" stroke-linecap="round"/>
  <path d="M85.5 104.5H110.5" fill="none" stroke="#f4b942" stroke-width="3" stroke-linecap="round" filter="url(#elements-glow)"/>
  <path d="M94 100V109M98 100V109M102 100V109" stroke="#f8e3ae" stroke-width="1.2"/>

  <!-- Excluded cell -->
  <g stroke="#b83b45" stroke-width="3.2" stroke-linecap="round">
    <path d="M128.5 122.5L142.5 136.5M142.5 122.5L128.5 136.5"/>
  </g>

  <!-- Row quotas -->
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
    <g><rect x="154" y="46" width="19" height="17" rx="8.5" fill="#21465f"/><text x="163.5" y="58" fill="#dff7ff">2</text></g>
    <g><rect x="154" y="71" width="19" height="17" rx="8.5" fill="#21465f"/><text x="163.5" y="83" fill="#dff7ff">2</text></g>
    <g><rect x="154" y="96" width="19" height="17" rx="8.5" fill="#21465f"/><text x="163.5" y="108" fill="#dff7ff">3</text></g>
    <g><rect x="154" y="121" width="19" height="17" rx="8.5" fill="#21465f"/><text x="163.5" y="133" fill="#dff7ff">1</text></g>
  </g>

  <!-- B exits downward -->
  <path d="M110.5 142V156" stroke="#202d36" stroke-width="7" stroke-linecap="round"/>
  <path d="M110.5 142V156" stroke="#e4fbff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="100" y="157" width="21" height="20" rx="10" fill="#f4b942"/>
  <text x="110.5" y="171" fill="#17212a" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">B</text>

  <!-- Compact legend -->
  <g font-family="system-ui, sans-serif" font-size="11" fill="#eafaff">
    <text x="190" y="44" font-size="10" font-weight="800" fill="#83dff0" letter-spacing="1">真实棋盘元素</text>
    <rect x="190" y="54" width="17" height="17" rx="4" fill="#1b7899" fill-opacity=".55" stroke="#baf4ff"/>
    <path d="M198.5 57V68M193 62.5H204" stroke="#e9fcff" stroke-width="1.4"/>
    <text x="216" y="67">固定轨型</text>

    <rect x="190" y="79" width="17" height="17" rx="4" fill="#82d9e7" fill-opacity=".25" stroke="#3ab8d0" stroke-dasharray="3 2"/>
    <text x="216" y="92">候选格</text>

    <path d="M192 106L205 119M205 106L192 119" stroke="#ef6d73" stroke-width="2.8" stroke-linecap="round"/>
    <text x="216" y="117">排除 ×</text>

    <path d="M190 139H207" stroke="#26343d" stroke-width="7" stroke-linecap="round"/>
    <path d="M190 139H207" stroke="#f4b942" stroke-width="2.5" stroke-linecap="round"/>
    <text x="216" y="143">共享边轨道</text>
  </g>
</svg>
