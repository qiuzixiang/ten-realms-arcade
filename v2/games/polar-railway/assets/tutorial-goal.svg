<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 184" preserveAspectRatio="xMidYMid meet" role="img" aria-label="极地蒸汽列车通关目标：一条无分叉无断头的完整铁路从左侧 A 连到下方 B，满足全部行列配额，并有小列车驶过">
  <title>完成一条从 A 到 B 且满足配额的铁路</title>
  <defs>
    <linearGradient id="goal-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c52"/>
      <stop offset=".58" stop-color="#092536"/>
      <stop offset="1" stop-color="#06141f"/>
    </linearGradient>
    <linearGradient id="goal-aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e1c1" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58e1c1" stop-opacity=".3"/>
      <stop offset="1" stop-color="#75c7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="goal-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="320" height="184" rx="18" fill="url(#goal-sky)"/>
  <path d="M113 7C162 26 224 4 307 24V63C225 40 164 62 93 38Z" fill="url(#goal-aurora)"/>
  <path d="M0 157Q50 139 102 155T210 151T320 150V184H0Z" fill="#c4e8ec" opacity=".14"/>
  <g fill="#d3f7ff" opacity=".38"><circle cx="21" cy="22" r="1.3"/><circle cx="179" cy="14" r="1"/><circle cx="296" cy="15" r="1.5"/><circle cx="286" cy="82" r="1"/></g>

  <text x="18" y="20" fill="#effcff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1">03 · 准点抵达</text>

  <!-- Exact column quotas for the completed route -->
  <g font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">
    <g fill="#0b2732" stroke="#69d6a7"><circle cx="48.5" cy="30" r="8"/><text x="48.5" y="33.2" fill="#bdf7dc" stroke="none">1</text></g>
    <g fill="#0b2732" stroke="#69d6a7"><circle cx="71.5" cy="30" r="8"/><text x="71.5" y="33.2" fill="#bdf7dc" stroke="none">4</text></g>
    <g fill="#0b2732" stroke="#69d6a7"><circle cx="94.5" cy="30" r="8"/><text x="94.5" y="33.2" fill="#bdf7dc" stroke="none">5</text></g>
    <g fill="#0b2732" stroke="#69d6a7"><circle cx="117.5" cy="30" r="8"/><text x="117.5" y="33.2" fill="#bdf7dc" stroke="none">5</text></g>
    <g fill="#0b2732" stroke="#69d6a7"><circle cx="140.5" cy="30" r="8"/><text x="140.5" y="33.2" fill="#bdf7dc" stroke="none">2</text></g>
  </g>

  <!-- Five-by-five solved board -->
  <rect x="37" y="40" width="115" height="115" rx="5" fill="#eaf7f7" stroke="#83bec8" stroke-width="2"/>
  <path d="M60 40V155M83 40V155M106 40V155M129 40V155M37 63H152M37 86H152M37 109H152M37 132H152" fill="none" stroke="#779faa" stroke-width=".9"/>

  <!-- Excluded cells: every unoccupied square is explicitly ruled out -->
  <g stroke="#b7444e" stroke-width="1.9" stroke-linecap="round" opacity=".9">
    <path d="M42 45L55 58M55 45L42 58M134 45L147 58M147 45L134 58"/>
    <path d="M134 68L147 81M147 68L134 81"/>
    <path d="M42 91L55 104M55 91L42 104M65 91L78 104M78 91L65 104"/>
    <path d="M42 114L55 127M55 114L42 127"/>
    <path d="M42 137L55 150M55 137L42 150M134 137L147 150M147 137L134 150"/>
  </g>

  <!-- One continuous, non-branching track; all connections cross shared edges -->
  <polyline points="27,74.5 48.5,74.5 71.5,74.5 71.5,51.5 94.5,51.5 117.5,51.5 117.5,74.5 94.5,74.5 94.5,97.5 117.5,97.5 140.5,97.5 140.5,120.5 117.5,120.5 94.5,120.5 71.5,120.5 71.5,143.5 94.5,143.5 117.5,143.5 117.5,169" fill="none" stroke="#26343c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="27,74.5 48.5,74.5 71.5,74.5 71.5,51.5 94.5,51.5 117.5,51.5 117.5,74.5 94.5,74.5 94.5,97.5 117.5,97.5 140.5,97.5 140.5,120.5 117.5,120.5 94.5,120.5 71.5,120.5 71.5,143.5 94.5,143.5 117.5,143.5 117.5,169" fill="none" stroke="#dff9fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goal-glow)"/>
  <polyline points="27,74.5 48.5,74.5 71.5,74.5 71.5,51.5 94.5,51.5 117.5,51.5 117.5,74.5 94.5,74.5 94.5,97.5 117.5,97.5 140.5,97.5 140.5,120.5 117.5,120.5 94.5,120.5 71.5,120.5 71.5,143.5 94.5,143.5 117.5,143.5 117.5,169" fill="none" stroke="#5ccfe1" stroke-width="1" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A left entry and B bottom exit -->
  <rect x="7" y="64.5" width="20" height="20" rx="10" fill="#f4b942"/>
  <text x="17" y="78.4" fill="#17212a" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">A</text>
  <rect x="107" y="160" width="21" height="20" rx="10" fill="#f4b942"/>
  <text x="117.5" y="174" fill="#17212a" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">B</text>

  <!-- Checked row quotas -->
  <g font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">
    <g><rect x="158" y="43.5" width="23" height="16" rx="8" fill="#163e3b" stroke="#69d6a7"/><text x="169.5" y="55" fill="#c7f8dd">3 ✓</text></g>
    <g><rect x="158" y="66.5" width="23" height="16" rx="8" fill="#163e3b" stroke="#69d6a7"/><text x="169.5" y="78" fill="#c7f8dd">4 ✓</text></g>
    <g><rect x="158" y="89.5" width="23" height="16" rx="8" fill="#163e3b" stroke="#69d6a7"/><text x="169.5" y="101" fill="#c7f8dd">3 ✓</text></g>
    <g><rect x="158" y="112.5" width="23" height="16" rx="8" fill="#163e3b" stroke="#69d6a7"/><text x="169.5" y="124" fill="#c7f8dd">4 ✓</text></g>
    <g><rect x="158" y="135.5" width="23" height="16" rx="8" fill="#163e3b" stroke="#69d6a7"/><text x="169.5" y="147" fill="#c7f8dd">3 ✓</text></g>
  </g>

  <!-- A compact locomotive on the finished line, kept clear of quotas -->
  <g transform="translate(132 106)">
    <rect x="0" y="0" width="16" height="10" rx="3" fill="#e14c48" stroke="#64292a" stroke-width="1"/>
    <rect x="9" y="-5" width="6" height="7" rx="1" fill="#f5c14d" stroke="#64292a"/>
    <path d="M2 0V-3H7V0" fill="#e14c48" stroke="#64292a"/>
    <circle cx="4" cy="11" r="2.3" fill="#17232a" stroke="#d9f8fb"/><circle cx="13" cy="11" r="2.3" fill="#17232a" stroke="#d9f8fb"/>
    <path d="M4 -5C1 -10 7 -10 5 -14" fill="none" stroke="#d9f8fb" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- Victory condition card -->
  <g font-family="system-ui, sans-serif">
    <rect x="193" y="45" width="111" height="108" rx="14" fill="#0b2635" stroke="#5790a0"/>
    <circle cx="248.5" cy="68" r="15" fill="#173e3c" stroke="#69d6a7" stroke-width="2"/>
    <path d="M241 68L246 73L256 62" fill="none" stroke="#bdf7dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="248.5" y="94" text-anchor="middle" fill="#f4d274" font-size="12" font-weight="900">A → B 通车</text>
    <g fill="#d7f5fa" font-size="10">
      <text x="207" y="113">✓ 配额全部满足</text>
      <text x="207" y="130">✓ 无分叉、无断头</text>
      <text x="207" y="147">✓ 没有错误回路</text>
    </g>
  </g>
</svg>
