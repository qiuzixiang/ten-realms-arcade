<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 184" preserveAspectRatio="xMidYMid meet" role="img" aria-label="冰窗校极真实操作中间态：A 槽中性、E 槽反向、G 槽正向，手指停在 E 槽正极端，四周线索同步更新" data-level-id="ice-window" data-tutorial-scene="operation" data-state="intermediate" data-position="A=N,E=R,G=F" data-active-slot="E" data-active-end="1">
  <title>冰窗校极：点击槽位一端后的真实中间局面</title>
  <desc>一张单一当前棋盘状态，不叠放操作前后图。点击 E 槽右端后，右端成为正极、左端同步成为负极；第三行当前计数达到目标，但仍要明确 F 槽才能正式满足线索。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07162f"/><stop offset=".58" stop-color="#102858"/><stop offset="1" stop-color="#180f35"/></linearGradient>
    <radialGradient id="plus" cx="35%" cy="28%" r="75%"><stop stop-color="#b8fff7"/><stop offset=".4" stop-color="#31e7df"/><stop offset="1" stop-color="#079eae"/></radialGradient>
    <linearGradient id="minus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff83db"/><stop offset="1" stop-color="#bd278f"/></linearGradient>
    <linearGradient id="neutral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe093"/><stop offset="1" stop-color="#d58a2d"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
