<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="极光磁场实验室操作教程：第一步选择成对槽位，第二步放入正负磁极或中性件，第三步核对行列线索与同极相邻规则">
  <title>极光磁场实验室：三步完成一次操作</title>
  <desc>三个互不重叠的实色步骤面板，分别显示选择槽位、放置正负磁极、核对线索；没有使用淡化的前后状态。</desc>
  <defs>
    <linearGradient id="operation-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07142d"/>
      <stop offset="0.52" stop-color="#122a59"/>
      <stop offset="1" stop-color="#190f38"/>
    </linearGradient>
    <linearGradient id="operation-positive" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9afff5"/>
      <stop offset="0.46" stop-color="#29e2d9"/>
      <stop offset="1" stop-color="#079daf"/>
    </linearGradient>
    <linearGradient id="operation-negative" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff91de"/>
      <stop offset="1" stop-color="#c22792"/>
    </linearGradient>
    <linearGradient id="operation-neutral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe098"/>
      <stop offset="1" stop-color="#d59033"/>
    </linearGradient>
    <linearGradient id="operation-aurora" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#40f3dc"/>
      <stop offset="0.5" stop-color="#7a8cff"/>
      <stop offset="1" stop-color="#f154c1"/>
    </linearGradient>
    <filter id="operation-shadow" x="-25%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#010615" flood-opacity="0.6"/>
    </filter>
    <filter id="operation-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" rx="24" fill="url(#operation-bg)"/>
  <path d="M0 55C104 13 145 69 238 35s155-22 229 10 114 21 173-16" fill="none" stroke="url(#operation-aurora)" stroke-width="10" stroke-linecap="round" filter="url(#operation-glow)"/>

  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <text x="24" y="38" fill="#f4fbff" font-size="22" font-weight="800">一次操作，三步读懂</text>
    <text x="616" y="36" text-anchor="end" fill="#a8c8e9" font-size="12" font-weight="700">每一步都是独立棋盘状态</text>

    <g filter="url(#operation-shadow)">
      <rect x="18" y="68" width="190" height="270" rx="20" fill="#102244" stroke="#6685ad" stroke-width="2"/>
      <rect x="225" y="68" width="190" height="270" rx="20" fill="#102244" stroke="#36dcd7" stroke-width="2"/>
      <rect x="432" y="68" width="190" height="270" rx="20" fill="#102244" stroke="#74e7b5" stroke-width="2"/>
    </g>

    <path d="M211 202h10" stroke="#d8e8ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M223 202l-8-6v12z" fill="#d8e8ff"/>
    <path d="M418 202h10" stroke="#d8e8ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M430 202l-8-6v12z" fill="#d8e8ff"/>

    <g aria-label="第一步，点击一个成对槽位">
      <circle cx="43" cy="94" r="16" fill="#6b83aa"/>
      <text x="43" y="100" text-anchor="middle" fill="#fff" font-size="16" font-weight="900">1</text>
      <text x="67" y="100" fill="#f4f8ff" font-size="17" font-weight="800">选择槽位</text>

      <g transform="translate(45 128)">
        <rect width="136" height="76" rx="13" fill="#08152f" stroke="#57749d" stroke-width="2"/>
        <rect x="4" y="4" width="64" height="34" rx="8" fill="#152d53" stroke="#ffe077" stroke-width="3"/>
        <path d="M36 5v32" stroke="#bda951" stroke-width="2"/>
        <rect x="72" y="4" width="60" height="34" rx="8" fill="#152d53" stroke="#4d6b93" stroke-width="2"/>
        <path d="M102 5v32" stroke="#49688f"/>
        <rect x="4" y="42" width="64" height="30" rx="8" fill="#152d53" stroke="#4d6b93" stroke-width="2"/>
        <path d="M36 43v28" stroke="#49688f"/>
        <rect x="72" y="42" width="60" height="30" rx="8" fill="#152d53" stroke="#4d6b93" stroke-width="2"/>
        <path d="M102 43v28" stroke="#49688f"/>
      </g>
      <path d="M78 219l9-19 8 14 15-5-8 20z" fill="#ffe077" stroke="#fff2b7" stroke-width="1.5"/>
      <text x="113" y="252" text-anchor="middle" fill="#eef5ff" font-size="13" font-weight="800">点击黄色框内的整组</text>
      <text x="113" y="276" text-anchor="middle" fill="#9db8d8" font-size="11">槽位中的两格会一起变化</text>
      <rect x="45" y="294" width="136" height="25" rx="12.5" fill="#2d3855"/>
      <text x="113" y="311" text-anchor="middle" fill="#d6e5fa" font-size="10" font-weight="700">空槽仍保留成对边框</text>
    </g>

    <g aria-label="第二步，在槽位中放入青色圆形正极与洋红菱形负极，也可以选择中性件">
      <circle cx="250" cy="94" r="16" fill="#1bbdb9"/>
      <text x="250" y="100" text-anchor="middle" fill="#032e38" font-size="16" font-weight="900">2</text>
      <text x="274" y="100" fill="#f4f8ff" font-size="17" font-weight="800">放入磁极</text>

      <g transform="translate(252 128)">
        <rect width="136" height="76" rx="13" fill="#08152f" stroke="#57749d" stroke-width="2"/>
        <rect x="4" y="4" width="64" height="34" rx="8" fill="#14334d" stroke="#37e5df" stroke-width="3"/>
        <path d="M36 5v32" stroke="#387f8f" stroke-width="2"/>
        <circle cx="20" cy="21" r="13" fill="url(#operation-positive)" stroke="#d6fffb"/>
        <text x="20" y="24" text-anchor="middle" fill="#04303a" font-size="7.5" font-weight="900">+ 正</text>
        <path d="M52 8l13 13-13 13-13-13z" fill="url(#operation-negative)" stroke="#ffd7f2"/>
        <text x="52" y="24" text-anchor="middle" fill="#4a073b" font-size="7" font-weight="900">− 负</text>
        <rect x="72" y="4" width="60" height="34" rx="8" fill="#152d53" stroke="#4d6b93" stroke-width="2"/>
        <path d="M102 5v32" stroke="#49688f"/>
        <rect x="4" y="42" width="64" height="30" rx="8" fill="#152d53" stroke="#4d6b93" stroke-width="2"/>
        <path d="M36 43v28" stroke="#49688f"/>
        <rect x="72" y="42" width="60" height="30" rx="8" fill="#152d53" stroke="#4d6b93" stroke-width="2"/>
        <path d="M102 43v28" stroke="#49688f"/>
      </g>

      <path d="M280 222c12-12 34-12 46 0" fill="none" stroke="#d9e8ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M329 224l-10-2 6-8z" fill="#d9e8ff"/>
      <text x="320" y="252" text-anchor="middle" fill="#eef5ff" font-size="13" font-weight="800">继续点击可切换方向</text>
      <g transform="translate(259 285)">
        <path d="M0 7L13 0l13 7v18l-13 7L0 25z" fill="url(#operation-neutral)" stroke="#fff0bf"/>
        <text x="13" y="19" text-anchor="middle" fill="#53330d" font-size="7" font-weight="900">中性</text>
        <text x="37" y="21" fill="#d7e5f8" font-size="10" font-weight="700">也可切换为中性件</text>
      </g>
    </g>

    <g aria-label="第三步，核对正负数量线索，并确保相邻格没有相同磁极">
      <circle cx="457" cy="94" r="16" fill="#65dca7"/>
      <text x="457" y="100" text-anchor="middle" fill="#073728" font-size="16" font-weight="900">3</text>
      <text x="481" y="100" fill="#f4f8ff" font-size="17" font-weight="800">核对线索</text>

      <g transform="translate(474 125)">
        <rect x="20" y="15" width="96" height="76" rx="12" fill="#08152f" stroke="#58769f" stroke-width="2"/>
        <path d="M68 16v74M21 53h94" stroke="#4a678f"/>
        <circle cx="44" cy="34" r="14" fill="url(#operation-positive)" stroke="#d6fffb"/>
        <text x="44" y="37" text-anchor="middle" fill="#04303a" font-size="7.5" font-weight="900">+ 正</text>
        <path d="M92 20l14 14-14 14-14-14z" fill="url(#operation-negative)" stroke="#ffd7f2"/>
        <text x="92" y="37" text-anchor="middle" fill="#4a073b" font-size="7" font-weight="900">− 负</text>
        <path d="M30 61l14-8 14 8v17l-14 8-14-8z" fill="url(#operation-neutral)" stroke="#fff0bf"/>
        <text x="44" y="72" text-anchor="middle" fill="#53330d" font-size="7" font-weight="900">中性</text>
        <circle cx="92" cy="72" r="14" fill="url(#operation-positive)" stroke="#d6fffb"/>
        <text x="92" y="75" text-anchor="middle" fill="#04303a" font-size="7.5" font-weight="900">+ 正</text>

        <rect x="-3" y="20" width="19" height="27" rx="7" fill="#0c4b4d" stroke="#4ff2dc"/>
        <text x="6.5" y="32" text-anchor="middle" fill="#bafff6" font-size="7" font-weight="900">+1</text>
        <text x="6.5" y="42" text-anchor="middle" fill="#8ff3bd" font-size="8">✓</text>
        <rect x="-3" y="58" width="19" height="27" rx="7" fill="#4c1741" stroke="#f36ac4"/>
        <text x="6.5" y="70" text-anchor="middle" fill="#ffd5f0" font-size="7" font-weight="900">−1</text>
        <text x="6.5" y="80" text-anchor="middle" fill="#8ff3bd" font-size="8">✓</text>
        <rect x="121" y="20" width="19" height="27" rx="7" fill="#0c4b4d" stroke="#4ff2dc"/>
        <text x="130.5" y="32" text-anchor="middle" fill="#bafff6" font-size="7" font-weight="900">+1</text>
        <text x="130.5" y="42" text-anchor="middle" fill="#8ff3bd" font-size="8">✓</text>
        <rect x="121" y="58" width="19" height="27" rx="7" fill="#4c1741" stroke="#f36ac4"/>
        <text x="130.5" y="70" text-anchor="middle" fill="#ffd5f0" font-size="7" font-weight="900">−1</text>
        <text x="130.5" y="80" text-anchor="middle" fill="#8ff3bd" font-size="8">✓</text>
      </g>

      <path d="M487 235l9 9 18-23" fill="none" stroke="#79efb8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="527" y="252" text-anchor="middle" fill="#eef5ff" font-size="13" font-weight="800">线索变绿才算匹配</text>
      <text x="527" y="277" text-anchor="middle" fill="#9db8d8" font-size="11">上下左右不能出现同极</text>
      <rect x="459" y="294" width="136" height="25" rx="12.5" fill="#16443e" stroke="#4ecb9d"/>
      <text x="527" y="311" text-anchor="middle" fill="#bffff0" font-size="10" font-weight="800">数量满足 · 没有冲突</text>
    </g>
  </g>
</svg>
