    </radialGradient>
    <linearGradient id="goal-negative" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff91de"/>
      <stop offset="1" stop-color="#c32692"/>
    </linearGradient>
    <linearGradient id="goal-neutral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#d18a31"/>
    </linearGradient>
    <linearGradient id="goal-board" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#17345c"/>
      <stop offset="1" stop-color="#09172f"/>
    </linearGradient>
    <filter id="goal-aurora-glow" x="-30%" y="-150%" width="160%" height="400%">
