        <rect x="222" y="203" width="40" height="40" rx="8"/><rect x="266" y="203" width="40" height="40" rx="8"/><rect x="310" y="203" width="40" height="40" rx="8"/><rect x="354" y="203" width="34" height="40" rx="8"/>
