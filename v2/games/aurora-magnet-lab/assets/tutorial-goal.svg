<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="极光磁场实验室完成目标：完整四乘四棋盘中正负数量全部匹配，同极互不相邻，中性件不计数，天空亮起青绿与紫色极光">
  <title>极光磁场实验室：完成无冲突棋盘</title>
  <desc>四乘四棋盘全部填满。每一行和每一列的正负线索都精确满足，相邻格没有相同磁极，底部两个槽位使用中性件；背景极光已经点亮。</desc>
  <defs>
    <linearGradient id="goal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#041226"/>
      <stop offset="0.54" stop-color="#102a55"/>
      <stop offset="1" stop-color="#1d1042"/>
    </linearGradient>
    <linearGradient id="goal-aurora-a" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#42f5ce" stop-opacity="0"/>
      <stop offset="0.23" stop-color="#42f5ce" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#77cfff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#77cfff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goal-aurora-b" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b74ff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#8b74ff" stop-opacity="0.78"/>
      <stop offset="0.68" stop-color="#ff5bc6" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#ff5bc6" stop-opacity="0"/>
