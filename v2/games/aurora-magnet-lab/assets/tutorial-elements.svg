<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 184" preserveAspectRatio="xMidYMid meet" role="img" aria-label="冰窗校极真实初始棋盘：四乘四固定双格槽位、四周正负数量线索，以及正极、负极和中性模块图例" data-level-id="ice-window" data-tutorial-scene="elements" data-state="initial" data-board-size="4x4" data-column-plus="1,1,1,0" data-column-minus="1,1,0,1" data-row-plus="0,0,1,2" data-row-minus="0,0,1,2">
