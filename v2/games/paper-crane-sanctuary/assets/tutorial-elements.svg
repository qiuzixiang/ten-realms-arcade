  </g>
  <g font-family="system-ui,sans-serif">
    <path d="M160 146h72" stroke="#ffd992" stroke-width="2"/><circle cx="160" cy="146" r="4" fill="#ffd992"/><text x="44" y="140" fill="#fff7df" font-size="20" font-weight="700">纸鹤</text><text x="44" y="165" fill="#d7c0d8" font-size="14">可作为起跳与被跨对象</text>
    <path d="M490 232h74" stroke="#ffd992" stroke-width="2"/><circle cx="564" cy="232" r="4" fill="#ffd992"/><text x="574" y="226" fill="#fff7df" font-size="20" font-weight="700">空栖位</text><text x="574" y="251" fill="#d7c0d8" font-size="14">纸鹤只能落在这里</text>
    <rect x="45" y="342" width="630" height="48" rx="15" fill="#120b25" opacity=".7"/><text x="360" y="373" text-anchor="middle" fill="#fff7df" font-size="17">暗色断台不可进入；只有水平或垂直相邻的栖位属于同一航线</text>
  </g>
