      <g transform="translate(0 66)"><rect width="126" height="56" rx="10" fill="#fff5dc" stroke="#c18a32"/><use href="#d2" x="9" y="8" width="40" height="40"/><text x="58" y="26" fill="#20342f" font-size="15" font-weight="900">秋金</text><text x="58" y="43" fill="#596a61" font-size="10">叶 · 落叶绫纹</text></g>
      <g transform="translate(138 66)"><rect width="126" height="56" rx="10" fill="#eaf3f5" stroke="#4d7185"/><use href="#d3" x="9" y="8" width="40" height="40"/><text x="58" y="26" fill="#20342f" font-size="15" font-weight="900">冬蓝</text><text x="58" y="43" fill="#596a61" font-size="10">❄ · 雪花格纹</text></g>
