      <g transform="translate(138 132)"><rect width="126" height="56" rx="10" fill="#e9efeb" stroke="#354b47"/><use href="#d5" x="9" y="8" width="40" height="40"/><text x="58" y="26" fill="#20342f" font-size="15" font-weight="900">松墨</text><text x="58" y="43" fill="#596a61" font-size="10">松 · 松针星纹</text></g>
