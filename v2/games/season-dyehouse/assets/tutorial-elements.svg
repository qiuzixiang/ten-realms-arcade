<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="elements-title elements-desc" data-tutorial-state="elements" data-preset-id="12x12-easy" data-seed="1">
  <title id="elements-title">四季染坊真实题面的染池、织格与六味染料</title>
  <desc id="elements-desc">截取种子一真实题面的左上五乘五区域。左上池字格是染池，右侧完整展示游戏内春青、夏绯、秋金、冬蓝、梅紫和松墨六味染料的真实符号与纹理。</desc>
