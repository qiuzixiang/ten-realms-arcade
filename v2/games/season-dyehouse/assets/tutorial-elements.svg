      <use href="#d3" x="0" y="156" width="36" height="36"/><use href="#d5" x="39" y="156" width="36" height="36"/><use href="#d1" x="78" y="156" width="36" height="36"/><use href="#d5" x="117" y="156" width="36" height="36"/><use href="#d4" x="156" y="156" width="36" height="36"/>
