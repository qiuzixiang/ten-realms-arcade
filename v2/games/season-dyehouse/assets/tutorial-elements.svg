<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="elements-title elements-desc">
  <title id="elements-title">四季染坊的布面、左上染池与四种季节染料</title>
  <desc id="elements-desc">左侧是一块由彩色织格组成的布面，左上角染池被金色轮廓标出。右侧依次展示带有嫩芽、太阳、落叶和雪花形状及不同织纹的春、夏、秋、冬染料。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4df"/>
      <stop offset="0.55" stop-color="#f4e6c8"/>
      <stop offset="1" stop-color="#ead4ad"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#825738"/>
      <stop offset="1" stop-color="#56351f"/>
    </linearGradient>
    <pattern id="paper-fibre" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M-4 5L22 1M-3 15L21 11" fill="none" stroke="#7b5638" stroke-width="1" opacity="0.08"/>
      <circle cx="4" cy="12" r="1" fill="#7b5638" opacity="0.08"/>
    </pattern>
    <pattern id="spring" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#4f8a62"/>
      <path d="M0 8L8 0M5 10L10 5" stroke="#a9d29f" stroke-width="1.4" opacity="0.5"/>
      <circle cx="2" cy="2" r="1" fill="#e2f0cf" opacity="0.68"/>
    </pattern>
    <pattern id="summer" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#c94f3b"/>
      <path d="M0 3H12M0 9H12" stroke="#f5a36f" stroke-width="1.5" opacity="0.52"/>
      <path d="M3 0V12M9 0V12" stroke="#7d2e2a" stroke-width="0.8" opacity="0.22"/>
    </pattern>
    <pattern id="autumn" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#c8892f"/>
      <path d="M-2 11L11-2M3 14L14 3" stroke="#f3cc72" stroke-width="2" opacity="0.52"/>
      <path d="M0 1H12" stroke="#8e5620" stroke-width="1" opacity="0.28"/>
    </pattern>
    <pattern id="winter" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#49759d"/>
      <path d="M0 6H12M6 0V12" stroke="#b8d8e3" stroke-width="1.2" opacity="0.46"/>
      <circle cx="6" cy="6" r="1.4" fill="#e8f4f2" opacity="0.75"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#513522" flood-opacity="0.22"/>
    </filter>
    <symbol id="sprout" viewBox="0 0 28 28">
      <path d="M14 23V12" fill="none" stroke="#f6f0ce" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M14 13C8 13 5 10 5 5c6 0 9 3 9 8ZM14 16c6 0 9-3 9-8-6 0-9 3-9 8Z" fill="#f6f0ce" stroke="#315942" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M9 23H19" stroke="#f6f0ce" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="sun" viewBox="0 0 28 28">
      <circle cx="14" cy="14" r="5.5" fill="#fff1c9" stroke="#7d2e2a" stroke-width="1.2"/>
      <path d="M14 2.5V6M14 22v3.5M2.5 14H6M22 14h3.5M5.8 5.8l2.5 2.5m11.4 11.4 2.5 2.5m0-16.4-2.5 2.5M8.3 19.7l-2.5 2.5" fill="none" stroke="#fff1c9" stroke-width="2.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="leaf" viewBox="0 0 28 28">
      <path d="M23 5C13 5 7 9 7 17c0 4 2 6 5 6 8 0 11-8 11-18Z" fill="#fff0b2" stroke="#74451e" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M5 24c4-6 8-10 15-15M11 18l1-5m2 2h5" fill="none" stroke="#74451e" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="snow" viewBox="0 0 28 28">
      <path d="M14 3v22M4.5 8.5l19 11M4.5 19.5l19-11M10.5 5.5 14 8.3l3.5-2.8M10.5 22.5l3.5-2.8 3.5 2.8M5.2 12.6l4.2-.6.9-4M22.8 15.4l-4.2.6-.9 4M5.2 15.4l4.2.6.9 4M22.8 12.6l-4.2-.6-.9-4" fill="none" stroke="#f2f7ed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="640" height="360" rx="24" fill="url(#paper)"/>
  <rect width="640" height="360" rx="24" fill="url(#paper-fibre)"/>
  <path d="M0 0h640v10H0z" fill="#6d4328"/>
  <circle cx="25" cy="30" r="5" fill="#c8892f" opacity="0.65"/>
  <circle cx="614" cy="330" r="7" fill="#4f8a62" opacity="0.35"/>

  <text x="32" y="43" fill="#3f2b20" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="28" font-weight="800">认识你的四季布面</text>
  <text x="33" y="68" fill="#72503a" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="16" font-weight="600">每格同时用颜色、织纹和形状标记</text>

  <g filter="url(#shadow)">
    <rect x="32" y="84" width="284" height="244" rx="18" fill="#fff9e9" stroke="#9c744d" stroke-width="2"/>
    <rect x="42" y="94" width="264" height="216" rx="13" fill="url(#wood)"/>
    <path d="M48 101v201M300 101v201" stroke="#d4a65f" stroke-width="4" opacity="0.65"/>

    <g stroke="#fff8dc" stroke-width="1.4">
      <g><rect x="58" y="106" width="44" height="44" rx="7" fill="url(#spring)"/><use href="#sprout" x="66" y="114" width="28" height="28"/></g>
      <g><rect x="106" y="106" width="44" height="44" rx="7" fill="url(#spring)"/><use href="#sprout" x="114" y="114" width="28" height="28"/></g>
      <g><rect x="154" y="106" width="44" height="44" rx="7" fill="url(#summer)"/><use href="#sun" x="162" y="114" width="28" height="28"/></g>
      <g><rect x="202" y="106" width="44" height="44" rx="7" fill="url(#winter)"/><use href="#snow" x="210" y="114" width="28" height="28"/></g>
      <g><rect x="250" y="106" width="44" height="44" rx="7" fill="url(#autumn)"/><use href="#leaf" x="258" y="114" width="28" height="28"/></g>

      <g><rect x="58" y="154" width="44" height="44" rx="7" fill="url(#spring)"/><use href="#sprout" x="66" y="162" width="28" height="28"/></g>
      <g><rect x="106" y="154" width="44" height="44" rx="7" fill="url(#autumn)"/><use href="#leaf" x="114" y="162" width="28" height="28"/></g>
      <g><rect x="154" y="154" width="44" height="44" rx="7" fill="url(#summer)"/><use href="#sun" x="162" y="162" width="28" height="28"/></g>
      <g><rect x="202" y="154" width="44" height="44" rx="7" fill="url(#summer)"/><use href="#sun" x="210" y="162" width="28" height="28"/></g>
      <g><rect x="250" y="154" width="44" height="44" rx="7" fill="url(#winter)"/><use href="#snow" x="258" y="162" width="28" height="28"/></g>

      <g><rect x="58" y="202" width="44" height="44" rx="7" fill="url(#summer)"/><use href="#sun" x="66" y="210" width="28" height="28"/></g>
      <g><rect x="106" y="202" width="44" height="44" rx="7" fill="url(#autumn)"/><use href="#leaf" x="114" y="210" width="28" height="28"/></g>
      <g><rect x="154" y="202" width="44" height="44" rx="7" fill="url(#winter)"/><use href="#snow" x="162" y="210" width="28" height="28"/></g>
      <g><rect x="202" y="202" width="44" height="44" rx="7" fill="url(#spring)"/><use href="#sprout" x="210" y="210" width="28" height="28"/></g>
      <g><rect x="250" y="202" width="44" height="44" rx="7" fill="url(#autumn)"/><use href="#leaf" x="258" y="210" width="28" height="28"/></g>

      <g><rect x="58" y="250" width="44" height="44" rx="7" fill="url(#winter)"/><use href="#snow" x="66" y="258" width="28" height="28"/></g>
      <g><rect x="106" y="250" width="44" height="44" rx="7" fill="url(#summer)"/><use href="#sun" x="114" y="258" width="28" height="28"/></g>
      <g><rect x="154" y="250" width="44" height="44" rx="7" fill="url(#spring)"/><use href="#sprout" x="162" y="258" width="28" height="28"/></g>
      <g><rect x="202" y="250" width="44" height="44" rx="7" fill="url(#autumn)"/><use href="#leaf" x="210" y="258" width="28" height="28"/></g>
      <g><rect x="250" y="250" width="44" height="44" rx="7" fill="url(#winter)"/><use href="#snow" x="258" y="258" width="28" height="28"/></g>
    </g>

    <rect x="54" y="102" width="52" height="52" rx="10" fill="none" stroke="#fff4b0" stroke-width="4"/>
    <path d="M58 103h48v48" fill="none" stroke="#4c2e1d" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="43" y="78" width="94" height="28" rx="14" fill="#4c2e1d"/>
    <text x="90" y="98" text-anchor="middle" fill="#fff4d2" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="16" font-weight="800">左上染池</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="338" y="84" width="270" height="244" rx="18" fill="#fff9e9" stroke="#9c744d" stroke-width="2"/>
    <text x="360" y="115" fill="#4b3324" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="20" font-weight="800">季节染料</text>

    <g>
      <rect x="356" y="128" width="234" height="42" rx="11" fill="#edf4e7" stroke="#4f8a62" stroke-width="2"/>
      <rect x="366" y="133" width="32" height="32" rx="8" fill="url(#spring)"/><use href="#sprout" x="370" y="137" width="24" height="24"/>
      <text x="414" y="155" fill="#315942" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="19" font-weight="800">春 · 嫩芽斜纹</text>
    </g>
    <g>
      <rect x="356" y="177" width="234" height="42" rx="11" fill="#fff0e7" stroke="#c94f3b" stroke-width="2"/>
      <rect x="366" y="182" width="32" height="32" rx="8" fill="url(#summer)"/><use href="#sun" x="370" y="186" width="24" height="24"/>
      <text x="414" y="204" fill="#7d2e2a" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="19" font-weight="800">夏 · 日轮方纹</text>
    </g>
    <g>
      <rect x="356" y="226" width="234" height="42" rx="11" fill="#fff5dc" stroke="#c8892f" stroke-width="2"/>
      <rect x="366" y="231" width="32" height="32" rx="8" fill="url(#autumn)"/><use href="#leaf" x="370" y="235" width="24" height="24"/>
      <text x="414" y="253" fill="#74451e" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="19" font-weight="800">秋 · 落叶绫纹</text>
    </g>
    <g>
      <rect x="356" y="275" width="234" height="42" rx="11" fill="#eaf3f5" stroke="#49759d" stroke-width="2"/>
      <rect x="366" y="280" width="32" height="32" rx="8" fill="url(#winter)"/><use href="#snow" x="370" y="284" width="24" height="24"/>
      <text x="414" y="302" fill="#315571" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="19" font-weight="800">冬 · 雪花格纹</text>
    </g>
  </g>

  <text x="320" y="349" text-anchor="middle" fill="#664832" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700">从左上染池出发，让连通的织格一同换色</text>
</svg>
