    <rect x="42" y="119" width="216" height="216" rx="4" fill="url(#plum-grid)" stroke="#523545" stroke-width="4"/>
    <rect x="42" y="119" width="18" height="18" fill="#76516e" stroke="#ffe7a0" stroke-width="3"/>
    <text x="51" y="132" text-anchor="middle" fill="#fff6d1" font-family="serif" font-size="8" font-weight="900">池</text>
