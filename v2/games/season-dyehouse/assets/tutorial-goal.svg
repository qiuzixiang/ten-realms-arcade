<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="goal-title goal-desc">
  <title id="goal-title">在步数限制内把整幅布染成同一季节色</title>
  <desc id="goal-desc">画面只展示一块完成状态的布面，全部二十四个织格都是带落叶符号和绫纹的秋色。右侧完成牌显示八步完成，限制为十二步。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcf5e2"/>
      <stop offset="0.58" stop-color="#f4e6c9"/>
      <stop offset="1" stop-color="#e8cfaa"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#885b38"/>
      <stop offset="0.55" stop-color="#704526"/>
      <stop offset="1" stop-color="#4f2f1b"/>
    </linearGradient>
    <linearGradient id="medal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a0"/>
      <stop offset="0.48" stop-color="#d99c35"/>
      <stop offset="1" stop-color="#a56322"/>
    </linearGradient>
    <pattern id="fibre" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M-3 5L19 1M-3 14L19 10" stroke="#66442d" stroke-width="1" opacity="0.08"/>
      <circle cx="5" cy="11" r="1" fill="#66442d" opacity="0.09"/>
    </pattern>
    <pattern id="autumn" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#c8892f"/>
      <path d="M-2 11L11-2M3 14L14 3" stroke="#f3cc72" stroke-width="2" opacity="0.57"/>
      <path d="M0 1H12" stroke="#8e5620" stroke-width="1" opacity="0.3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#513522" flood-opacity="0.24"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="leaf" viewBox="0 0 28 28">
      <path d="M23 5C13 5 7 9 7 17c0 4 2 6 5 6 8 0 11-8 11-18Z" fill="#fff0b2" stroke="#74451e" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M5 24c4-6 8-10 15-15M11 18l1-5m2 2h5" fill="none" stroke="#74451e" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="autumn-tile" viewBox="0 0 48 48">
      <rect x="1" y="1" width="46" height="46" rx="7" fill="url(#autumn)" stroke="#fff1bd" stroke-width="2"/>
      <use href="#leaf" x="10" y="10" width="28" height="28"/>
    </symbol>
  </defs>

  <rect width="640" height="360" rx="24" fill="url(#paper)"/>
  <rect width="640" height="360" rx="24" fill="url(#fibre)"/>
  <path d="M0 0h640v10H0z" fill="#6d4328"/>
  <text x="32" y="43" fill="#3f2b20" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="28" font-weight="800">在步数用尽前，织成一色</text>
  <text x="33" y="68" fill="#72503a" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="16" font-weight="600">每一格都归入左上染池的连通区域，即可完成</text>

  <g filter="url(#shadow)">
    <rect x="25" y="88" width="360" height="242" rx="19" fill="#fff9e9" stroke="#9c744d" stroke-width="2"/>
    <rect x="36" y="99" width="338" height="220" rx="13" fill="url(#wood)"/>
    <rect x="42" y="105" width="326" height="208" rx="10" fill="#4d2e1c" stroke="#d7aa60" stroke-width="3"/>

    <path d="M49 109v200M361 109v200" stroke="#f1cd80" stroke-width="3" opacity="0.78"/>
    <path d="M53 108h304M53 312h304" stroke="#382116" stroke-width="5" stroke-linecap="round"/>

    <use href="#autumn-tile" x="47" y="110" width="48" height="48"/>
    <use href="#autumn-tile" x="99" y="110" width="48" height="48"/>
    <use href="#autumn-tile" x="151" y="110" width="48" height="48"/>
    <use href="#autumn-tile" x="203" y="110" width="48" height="48"/>
    <use href="#autumn-tile" x="255" y="110" width="48" height="48"/>
    <use href="#autumn-tile" x="307" y="110" width="48" height="48"/>

    <use href="#autumn-tile" x="47" y="162" width="48" height="48"/>
    <use href="#autumn-tile" x="99" y="162" width="48" height="48"/>
    <use href="#autumn-tile" x="151" y="162" width="48" height="48"/>
    <use href="#autumn-tile" x="203" y="162" width="48" height="48"/>
    <use href="#autumn-tile" x="255" y="162" width="48" height="48"/>
    <use href="#autumn-tile" x="307" y="162" width="48" height="48"/>

    <use href="#autumn-tile" x="47" y="214" width="48" height="48"/>
    <use href="#autumn-tile" x="99" y="214" width="48" height="48"/>
    <use href="#autumn-tile" x="151" y="214" width="48" height="48"/>
    <use href="#autumn-tile" x="203" y="214" width="48" height="48"/>
    <use href="#autumn-tile" x="255" y="214" width="48" height="48"/>
    <use href="#autumn-tile" x="307" y="214" width="48" height="48"/>

    <use href="#autumn-tile" x="47" y="266" width="48" height="48"/>
    <use href="#autumn-tile" x="99" y="266" width="48" height="48"/>
    <use href="#autumn-tile" x="151" y="266" width="48" height="48"/>
    <use href="#autumn-tile" x="203" y="266" width="48" height="48"/>
    <use href="#autumn-tile" x="255" y="266" width="48" height="48"/>
    <use href="#autumn-tile" x="307" y="266" width="48" height="48"/>

    <rect x="43" y="104" width="324" height="212" rx="12" fill="none" stroke="#ffe8a0" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="404" y="88" width="211" height="242" rx="20" fill="#fff9e9" stroke="#9c744d" stroke-width="2"/>
    <path d="M438 88h143v42l-17-10-17 10-18-10-18 10-18-10-18 10-18-10-19 10Z" fill="#7c3f2b"/>
    <text x="509.5" y="114" text-anchor="middle" fill="#fff4d2" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="20" font-weight="900">染色完成</text>

    <circle cx="509.5" cy="171" r="35" fill="url(#medal)" stroke="#7c491f" stroke-width="3" filter="url(#glow)"/>
    <path d="M493 171l10 10 22-24" fill="none" stroke="#fff8db" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="509.5" cy="171" r="27" fill="none" stroke="#fff1b2" stroke-width="2" stroke-dasharray="3 5"/>

    <text x="509.5" y="224" text-anchor="middle" fill="#72503a" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="16" font-weight="800">本局步数</text>
    <text x="509.5" y="263" text-anchor="middle" fill="#7c3f2b" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="36" font-weight="900">8 / 12</text>
    <path d="M438 278h143" stroke="#d9b77c" stroke-width="2" stroke-linecap="round"/>
    <text x="509.5" y="305" text-anchor="middle" fill="#4f6e45" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="17" font-weight="900">✓ 未超过限制</text>
  </g>

  <text x="320" y="349" text-anchor="middle" fill="#664832" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700">整幅布同色后立即通关；剩余步数越多，染工越精湛</text>
</svg>
