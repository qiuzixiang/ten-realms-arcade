<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="goal-title goal-desc" data-tutorial-state="goal" data-preset-id="12x12-easy" data-seed="1" data-board-size="12x12" data-final-colour="4" data-controlled="144" data-total="144" data-moves="20" data-move-limit="25" data-reference-moves="20">
  <title id="goal-title">种子一真实参考路线的十二乘十二完成状态</title>
  <desc id="goal-desc">春绢从容种子一的真实参考路线在二十步完成，步限二十五步。十二乘十二共一百四十四格全部变为梅紫，右侧数据与游戏胜利弹窗一致。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf4df"/><stop offset="1" stop-color="#ead4ad"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#513522" flood-opacity=".22"/></filter>
    <pattern id="plum-grid" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#76516e"/><circle cx="5" cy="5" r="3" fill="none" stroke="#efd3df" stroke-width="1" opacity=".32"/><path d="M18 0H0v18" fill="none" stroke="#fff8dc" stroke-width="1" opacity=".45"/><text x="9" y="12" text-anchor="middle" fill="#fff2e3" font-family="serif" font-size="8" font-weight="800">梅</text></pattern>
  </defs>
  <rect width="640" height="360" rx="24" fill="url(#paper)"/>
  <path d="M0 0h640v10H0z" fill="#6d4328"/>
  <text x="28" y="42" fill="#20342f" font-family="system-ui,sans-serif" font-size="24" font-weight="900">全幅同色，并且没有超过步限</text>
  <text x="29" y="66" fill="#596a61" font-family="system-ui,sans-serif" font-size="14" font-weight="650">真实示例：春绢·从容 / 题面 1 / 求解器参考路线</text>
  <g filter="url(#shadow)">
