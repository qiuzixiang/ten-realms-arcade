    <rect x="334" y="100" width="262" height="49" rx="13" fill="#29483f"/>
    <text x="352" y="122" fill="#d7aa56" font-size="11" font-weight="900">合幅完成</text><text x="352" y="140" fill="#fffaf0" font-family="serif" font-size="20" font-weight="850">一染成锦</text>
    <circle cx="558" cy="124" r="18" fill="#d7aa56"/><path d="m549 124 6 6 12-14" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(334 164)">
