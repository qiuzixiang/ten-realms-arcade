      <g transform="translate(91)"><rect width="80" height="70" rx="11" fill="#f1e7cf" stroke="#d5c29b"/><text x="40" y="22" text-anchor="middle" fill="#596a61" font-size="10" font-weight="800">染布步限</text><text x="40" y="52" text-anchor="middle" fill="#20342f" font-size="26" font-weight="900">25</text></g>
