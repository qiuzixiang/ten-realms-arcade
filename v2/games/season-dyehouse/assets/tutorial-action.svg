<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="action-title action-desc" data-tutorial-state="action" data-preset-id="12x12-easy" data-seed="1" data-selected-dye="0" data-before-controlled="1" data-after-controlled="3" data-expanded-by="2" data-board-prefix="3,0,3,5,5;0,2,1,0,2;3,4,1,1,3;1,4,0,1,2">
  <title id="action-title">种子一真实题面选择春青后的操作前后状态</title>
  <desc id="action-desc">左右独立展示种子一题面左上五乘四区域。操作前只有冬蓝左上格受控；选择春青后，原染池改成春青，并吸收上方右邻和下方邻格，受控格从一格增至三格。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf4df"/><stop offset="1" stop-color="#ead4ad"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#513522" flood-opacity=".22"/></filter>
    <symbol id="d0" viewBox="0 0 40 40"><rect width="40" height="40" rx="5" fill="#4f7865"/><path d="M-5 18 18-5M-5 38 38-5M6 45 45 6M26 45 45 26" stroke="#d7ead7" stroke-width="2" opacity=".35"/><text x="20" y="26" text-anchor="middle" fill="#fff6d8" font-family="serif" font-size="16" font-weight="800">芽</text></symbol>
    <symbol id="d1" viewBox="0 0 40 40"><rect width="40" height="40" rx="5" fill="#b65343"/><path d="M0 10h40M0 20h40M0 30h40M10 0v40M20 0v40M30 0v40" stroke="#f3c0a0" opacity=".35"/><text x="20" y="27" text-anchor="middle" fill="#fff6d8" font-family="serif" font-size="18" font-weight="800">☀</text></symbol>
    <symbol id="d2" viewBox="0 0 40 40"><rect width="40" height="40" rx="5" fill="#c18a32"/><path d="M-4 15 15-4M-4 35 35-4M5 44 44 5M25 44 44 25" stroke="#ffe8a5" stroke-width="2" opacity=".42"/><text x="20" y="26" text-anchor="middle" fill="#fff7d7" font-family="serif" font-size="16" font-weight="800">叶</text></symbol>
    <symbol id="d3" viewBox="0 0 40 40"><rect width="40" height="40" rx="5" fill="#4d7185"/><path d="M-10 0 40 50M0-10l50 50M50 0 0 50M40-10-10 40" stroke="#d9eef0" stroke-width="1.4" opacity=".3"/><text x="20" y="27" text-anchor="middle" fill="#f1fbf7" font-family="serif" font-size="18" font-weight="800">❄</text></symbol>
    <symbol id="d4" viewBox="0 0 40 40"><rect width="40" height="40" rx="5" fill="#76516e"/><circle cx="10" cy="10" r="5" fill="none" stroke="#efd3df" opacity=".32"/><circle cx="30" cy="30" r="5" fill="none" stroke="#efd3df" opacity=".32"/><text x="20" y="26" text-anchor="middle" fill="#fff2e3" font-family="serif" font-size="16" font-weight="800">梅</text></symbol>
    <symbol id="d5" viewBox="0 0 40 40"><rect width="40" height="40" rx="5" fill="#354b47"/><path d="M8 0v40M16 0v40M24 0v40M32 0v40" stroke="#c7dac9" stroke-width="1.4" opacity=".26"/><text x="20" y="26" text-anchor="middle" fill="#eef4dc" font-family="serif" font-size="16" font-weight="800">松</text></symbol>
  </defs>
  <rect width="640" height="360" rx="24" fill="url(#paper)"/>
  <path d="M0 0h640v10H0z" fill="#6d4328"/>
  <text x="28" y="42" fill="#20342f" font-family="system-ui,sans-serif" font-size="24" font-weight="900">点春青，染池从 1 格扩至 3 格</text>
  <text x="29" y="66" fill="#596a61" font-family="system-ui,sans-serif" font-size="14" font-weight="650">题面 1 · 左上真实区域；金线标出当步受控格</text>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif">
    <rect x="22" y="82" width="244" height="246" rx="17" fill="#fffaf0" stroke="#8e6626" stroke-width="2"/>
    <text x="40" y="108" fill="#29483f" font-size="14" font-weight="900">操作前 · 受控 1 格</text>
    <g transform="translate(47 126)" stroke="#fff8dc" stroke-width="1">
      <use href="#d3" x="0" y="0" width="32" height="32"/><use href="#d0" x="35" y="0" width="32" height="32"/><use href="#d3" x="70" y="0" width="32" height="32"/><use href="#d5" x="105" y="0" width="32" height="32"/><use href="#d5" x="140" y="0" width="32" height="32"/>
      <use href="#d0" x="0" y="35" width="32" height="32"/><use href="#d2" x="35" y="35" width="32" height="32"/><use href="#d1" x="70" y="35" width="32" height="32"/><use href="#d0" x="105" y="35" width="32" height="32"/><use href="#d2" x="140" y="35" width="32" height="32"/>
      <use href="#d3" x="0" y="70" width="32" height="32"/><use href="#d4" x="35" y="70" width="32" height="32"/><use href="#d1" x="70" y="70" width="32" height="32"/><use href="#d1" x="105" y="70" width="32" height="32"/><use href="#d3" x="140" y="70" width="32" height="32"/>
      <use href="#d1" x="0" y="105" width="32" height="32"/><use href="#d4" x="35" y="105" width="32" height="32"/><use href="#d0" x="70" y="105" width="32" height="32"/><use href="#d1" x="105" y="105" width="32" height="32"/><use href="#d2" x="140" y="105" width="32" height="32"/>
      <rect x="-2" y="-2" width="36" height="36" rx="6" fill="none" stroke="#ffe7a0" stroke-width="4"/><text x="16" y="22" text-anchor="middle" fill="#fff6d1" font-family="serif" font-size="14" font-weight="900">池</text>
    </g>
    <text x="40" y="292" fill="#596a61" font-size="12">当前染池：冬蓝</text><text x="40" y="311" fill="#a94736" font-size="12" font-weight="800">相邻春青还未接入</text>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><path d="M279 176h73v-16l24 25-24 25v-16h-73z" fill="#4f7865" stroke="#29483f" stroke-width="2"/><rect x="287" y="225" width="74" height="70" rx="15" fill="#edf4e7" stroke="#4f7865" stroke-width="2"/><use href="#d0" x="304" y="232" width="40" height="40"/><text x="324" y="287" fill="#29483f" font-size="13" font-weight="900">选择春青</text></g>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif">
    <rect x="374" y="82" width="244" height="246" rx="17" fill="#fffaf0" stroke="#8e6626" stroke-width="2"/>
    <text x="392" y="108" fill="#29483f" font-size="14" font-weight="900">操作后 · 受控 3 格（+2）</text>
    <g transform="translate(399 126)" stroke="#fff8dc" stroke-width="1">
      <use href="#d0" x="0" y="0" width="32" height="32"/><use href="#d0" x="35" y="0" width="32" height="32"/><use href="#d3" x="70" y="0" width="32" height="32"/><use href="#d5" x="105" y="0" width="32" height="32"/><use href="#d5" x="140" y="0" width="32" height="32"/>
      <use href="#d0" x="0" y="35" width="32" height="32"/><use href="#d2" x="35" y="35" width="32" height="32"/><use href="#d1" x="70" y="35" width="32" height="32"/><use href="#d0" x="105" y="35" width="32" height="32"/><use href="#d2" x="140" y="35" width="32" height="32"/>
      <use href="#d3" x="0" y="70" width="32" height="32"/><use href="#d4" x="35" y="70" width="32" height="32"/><use href="#d1" x="70" y="70" width="32" height="32"/><use href="#d1" x="105" y="70" width="32" height="32"/><use href="#d3" x="140" y="70" width="32" height="32"/>
      <use href="#d1" x="0" y="105" width="32" height="32"/><use href="#d4" x="35" y="105" width="32" height="32"/><use href="#d0" x="70" y="105" width="32" height="32"/><use href="#d1" x="105" y="105" width="32" height="32"/><use href="#d2" x="140" y="105" width="32" height="32"/>
      <g fill="none" stroke="#ffe7a0" stroke-width="4"><rect x="-2" y="-2" width="36" height="36" rx="6"/><rect x="33" y="-2" width="36" height="36" rx="6"/><rect x="-2" y="33" width="36" height="36" rx="6"/></g><text x="16" y="22" text-anchor="middle" fill="#fff6d1" font-family="serif" font-size="14" font-weight="900">池</text>
    </g>
    <text x="392" y="292" fill="#596a61" font-size="12">旧起点块先整体换色</text><text x="392" y="311" fill="#a94736" font-size="12" font-weight="800">再吸收正交接壤的春青格</text>
  </g>
  <text x="320" y="350" text-anchor="middle" fill="#664832" font-family="system-ui,sans-serif" font-size="13" font-weight="750">选择当前色无效；其他色即使没有扩张，也会计 1 步</text>
</svg>
