<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 184" preserveAspectRatio="xMidYMid meet" role="img" aria-label="初醒九响合法敲击中央第5枚钟后的真实状态，影响纹中的第2、3、4、5、6枚钟已同步翻转" data-game-id="resonance-bell-room" data-level-id="first-awakening" data-tutorial-version="2" data-tutorial-scene="operation" data-state="after-one-press" data-before-bits="110010000" data-action-index="4" data-action-display="5" data-affected-indices="1,2,3,4,5" data-after-bits="101101000" data-moves="1">
