<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 184" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">无缝完成的梦境旅舍楼层</title>
  <desc id="description">一个五乘五楼层被六间有清晰实线边界的矩形客房完整覆盖，没有重叠或空格。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171026"/><stop offset="1" stop-color="#09070f"/></linearGradient>
    <radialGradient id="clue" cx="35%" cy="28%" r="80%"><stop stop-color="#fff5d9"/><stop offset="1" stop-color="#d9aa57"/></radialGradient>
  </defs>
  <rect width="320" height="184" rx="14" fill="url(#bg)"/>
  <g transform="translate(20 17)">
    <rect width="150" height="150" rx="5" fill="#1a1326" stroke="#e6bd70" stroke-width="2"/>
    <g stroke="#5b5069" stroke-opacity=".45"><path d="M30 0V150M60 0V150M90 0V150M120 0V150M0 30H150M0 60H150M0 90H150M0 120H150"/></g>
    <g stroke="#ffe2a6" stroke-width="3" fill-opacity=".16">
      <rect x="1.5" y="1.5" width="87" height="57" rx="3" fill="#9d7be7"/>
      <rect x="1.5" y="61.5" width="87" height="27" rx="3" fill="#7bd8cf"/>
      <rect x="1.5" y="91.5" width="27" height="57" rx="3" fill="#cf84b6"/>
      <rect x="31.5" y="91.5" width="57" height="57" rx="3" fill="#7d9ae8"/>
      <rect x="91.5" y="1.5" width="57" height="57" rx="3" fill="#e6bd70"/>
      <rect x="91.5" y="61.5" width="57" height="87" rx="3" fill="#8fe2b2"/>
    </g>
    <g fill="url(#clue)" stroke="#ffe2a6">
      <circle cx="15" cy="45" r="10"/><circle cx="45" cy="75" r="10"/><circle cx="15" cy="135" r="10"/>
      <circle cx="45" cy="135" r="10"/><circle cx="105" cy="15" r="10"/><circle cx="135" cy="105" r="10"/>
    </g>
    <g fill="#24172d" font-family="Georgia,serif" font-size="11" font-weight="700" text-anchor="middle">
      <text x="15" y="49">6</text><text x="45" y="79">3</text><text x="15" y="139">2</text>
      <text x="45" y="139">4</text><text x="105" y="19">4</text><text x="135" y="109">6</text>
    </g>
    <g fill="#fff" fill-opacity=".22" font-size="16" text-anchor="middle"><text x="49" y="36">☾</text><text x="121" y="43">✦</text><text x="121" y="92">☁</text></g>
  </g>
  <g transform="translate(190 34)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <text fill="#e6bd70" font-size="8" font-weight="700" letter-spacing="1.5">FLOOR COMPLETE</text>
    <text y="28" fill="#f8f0ff" font-size="18" font-weight="700">整层无缝覆盖</text>
    <path d="M0 42H103" stroke="#e6bd70" stroke-opacity=".35"/>
    <g transform="translate(0 55)" fill="none" stroke="#8fe2b2" stroke-width="2"><circle cx="8" cy="8" r="7"/><path d="M4 8l3 3 6-7"/></g>
    <text x="22" y="67" fill="#b9adca" font-size="10">每房恰含一个数字</text>
    <g transform="translate(0 80)" fill="none" stroke="#8fe2b2" stroke-width="2"><circle cx="8" cy="8" r="7"/><path d="M4 8l3 3 6-7"/></g>
    <text x="22" y="92" fill="#b9adca" font-size="10">面积与数字完全相等</text>
    <g transform="translate(0 105)" fill="none" stroke="#8fe2b2" stroke-width="2"><circle cx="8" cy="8" r="7"/><path d="M4 8l3 3 6-7"/></g>
    <text x="22" y="117" fill="#b9adca" font-size="10">无重叠、无空格</text>
  </g>
</svg>
