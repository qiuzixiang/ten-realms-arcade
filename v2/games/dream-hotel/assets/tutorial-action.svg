    <g fill="url(#clue)" stroke="#ffe2a6"><circle cx="31.5" cy="67.5" r="9"/><circle cx="58.5" cy="94.5" r="9"/><circle cx="31.5" cy="148.5" r="9"/><circle cx="58.5" cy="148.5" r="9"/><circle cx="112.5" cy="40.5" r="9"/><circle cx="139.5" cy="121.5" r="9"/></g>
    <g fill="#24172d" font-family="Georgia,serif" font-size="10" font-weight="700" text-anchor="middle"><text x="31.5" y="71">6</text><text x="58.5" y="98">3</text><text x="31.5" y="152">2</text><text x="58.5" y="152">4</text><text x="112.5" y="44">4</text><text x="139.5" y="125">6</text></g>
    <circle cx="31.5" cy="40.5" r="6" fill="#171026" stroke="#7bd8cf" stroke-width="2.5"/><circle cx="85.5" cy="67.5" r="6" fill="#171026" stroke="#7bd8cf" stroke-width="2.5"/>
