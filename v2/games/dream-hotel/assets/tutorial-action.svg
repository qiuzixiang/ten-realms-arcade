<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 184" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description" data-level-id="lullaby-lobby" data-tutorial-scene="operation" data-state="intermediate" data-board-size="5x5" data-preview-room="0,0,3,2" data-preview-area="6" data-contained-clue="0,1,6">
  <title id="title">摇篮前厅真实三乘二客房预览</title>
  <desc id="description">正式首关摇篮前厅的单一操作中间态。从第一格拖到第二行第三格，金色预览框覆盖三乘二共六格，恰好只包含数字六，尚未松手提交。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171026"/><stop offset="1" stop-color="#09070f"/></linearGradient><radialGradient id="clue" cx="35%" cy="28%" r="80%"><stop stop-color="#fff5d9"/><stop offset="1" stop-color="#d9aa57"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#7bd8cf"/></marker></defs>
  <rect width="320" height="184" rx="14" fill="url(#bg)"/>
  <g font-family="system-ui, PingFang SC, sans-serif">
    <text x="16" y="19" fill="#f8f0ff" font-size="11" font-weight="800">02 · 摇篮前厅真实拖动预览</text>
    <rect x="18" y="27" width="135" height="135" rx="6" fill="#1c1528" stroke="#e6bd70" stroke-width="2"/>
    <path d="M45 27v135M72 27v135M99 27v135M126 27v135M18 54h135M18 81h135M18 108h135M18 135h135" fill="none" stroke="#675875" stroke-opacity=".76"/>
