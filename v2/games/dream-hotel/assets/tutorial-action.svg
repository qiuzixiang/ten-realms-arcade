    <rect x="175" y="33" width="130" height="129" rx="13" fill="#120d1c" stroke="#554066"/>
    <text x="188" y="52" fill="#e6bd70" font-size="8" font-weight="800" letter-spacing="1">DRAG TO PLAN</text>
    <text x="188" y="76" fill="#f8f0ff" font-size="16" font-weight="800">拖出 3 × 2</text>
    <rect x="188" y="89" width="104" height="34" rx="9" fill="#e6bd70" fill-opacity=".12" stroke="#e6bd70" stroke-opacity=".6"/>
    <text x="240" y="112" text-anchor="middle" fill="#ffe2a6" font-family="Georgia,serif" font-size="17" font-weight="700">3 × 2 = 6</text>
    <text x="188" y="139" fill="#b9adca" font-size="8">当前预览合法：只含数字 6</text>
