<!doctype html>
<html lang="zh-CN" data-realm="four-spirit-habitat">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102f2c" />
    <meta name="description" content="四灵栖境署：用四种守护灵为不规则栖境着色，让共享边界的区域彼此不同。" />
    <title>四灵栖境署 · 十境谜游馆 2.5</title>
    <link rel="stylesheet" href="../../shared/realm-ui.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="../../shared/realm-ui.mjs"></script>
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <div class="canopy" aria-hidden="true"></div>
    <header class="game-header">
      <a href="../../" class="back-link">← 返回 2.5 谜游馆</a>
      <div><small>REALM 15 · FOUR SPIRIT HABITAT</small><h1>四灵栖境署</h1></div>
      <button id="tutorial-button" type="button">玩法图册</button>
    </header>

    <main>
      <section class="story-panel" aria-labelledby="mission-title">
        <p class="eyebrow">生态边界校准任务</p>
        <h2 id="mission-title">让四灵各安其境</h2>
        <p>为每片栖境安置水麟、火羽、月狐或森龟。共享边界的栖境不能迎来同一种守护灵；只在角点相遇则互不影响。</p>
        <div class="level-list" data-levels aria-label="选择栖境"></div>
        <div class="rule-note"><span>◇</span><p><b>候选印不参与判定</b><br />先留下可能的守护灵，再做正式安置。</p></div>
      </section>

      <section class="play-panel" aria-labelledby="board-title">
        <header class="play-heading">
          <div><small data-difficulty>入门</small><h2 id="board-title" data-level-title>灵泉初醒</h2></div>
          <div class="stats"><span><b data-moves>0</b><small>安置步</small></span><span><b data-left>0</b><small>待安置</small></span></div>
        </header>

        <p class="status" data-status role="status" aria-live="polite">选择一种守护灵，再点按栖境。</p>
        <div class="board-wrap"><div class="habitat-board" data-board aria-label="四灵栖境棋盘"></div></div>

        <div class="palette" data-palette aria-label="守护灵工具">
          <button type="button" data-colour="0"><i>麟</i><span>水麟</span></button>
          <button type="button" data-colour="1"><i>羽</i><span>火羽</span></button>
          <button type="button" data-colour="2"><i>狐</i><span>月狐</span></button>
          <button type="button" data-colour="3"><i>龟</i><span>森龟</span></button>
        </div>
        <div class="toolbar">
          <button type="button" data-note aria-pressed="false">候选印：关</button>
          <button type="button" data-erase>清除栖境</button>
          <button type="button" data-undo>撤销</button>
          <button type="button" data-reset>重新校准</button>
        </div>
      </section>
    </main>

    <dialog class="tutorial-dialog" data-tutorial aria-labelledby="tutorial-title">
      <div class="tutorial-shell">
        <header><div><small>THREE TRUE STATES</small><h2 id="tutorial-title" data-tutorial-title>认识四灵</h2></div><button type="button" data-tutorial-close aria-label="跳过教程">×</button></header>
        <img data-tutorial-image src="./assets/tutorial-elements.svg?tutorial=1" alt="灵泉初醒的真实初始栖境与四种守护灵" />
        <p data-tutorial-copy></p>
        <ul data-tutorial-bullets></ul>
        <footer><button type="button" data-tutorial-prev>上一张</button><span data-tutorial-position>1 / 3</span><button type="button" data-tutorial-next>下一张</button></footer>
      </div>
    </dialog>

    <dialog class="win-dialog" data-win aria-labelledby="win-title">
      <div><span class="win-mark" aria-hidden="true">四灵和鸣</span><h2 id="win-title">栖境校准完成</h2><p data-win-copy></p><div><button type="button" data-win-close>留在本境</button><button type="button" data-win-next>前往下一境</button></div></div>
    </dialog>
  </body>
</html>
