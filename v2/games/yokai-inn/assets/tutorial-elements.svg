<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description" data-tutorial-state="elements">
  <title id="title">妖怪旅店的数字需求、双人客房与排除线</title>
  <desc id="description">四个带数字的房客需求格，两格外围的圆角边框表示确定配房，两个未入住格之间的叉线表示排除配对。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#201b35"/><stop offset="1" stop-color="#0d1730"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="8" y="8" width="624" height="344" rx="30" fill="url(#paper)" stroke="#f4c66d" stroke-width="3"/>
  <text x="42" y="50" fill="#f4c66d" font-family="system-ui,sans-serif" font-size="19" font-weight="800">房客需求格</text>
  <g transform="translate(42 76)" font-family="system-ui,sans-serif" text-anchor="middle">
    <g fill="#151e36" stroke="#8b7ca8" stroke-width="2">
      <rect x="0" y="0" width="92" height="92" rx="18"/><rect x="106" y="0" width="92" height="92" rx="18"/>
      <rect x="0" y="106" width="92" height="92" rx="18"/><rect x="106" y="106" width="92" height="92" rx="18"/>
    </g>
    <g fill="#fff7dc" font-size="42" font-weight="900">
      <text x="46" y="61">1</text><text x="152" y="61">3</text><text x="46" y="167">0</text><text x="152" y="167">2</text>
    </g>
    <rect x="-6" y="-6" width="210" height="104" rx="25" fill="none" stroke="#f4c66d" stroke-width="7"/>
    <path d="M75 129l46 46m0-46l-46 46" fill="none" stroke="#ff826e" stroke-width="9" stroke-linecap="round"/>
    <path d="M76 152h44" stroke="#fff7dc" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(286 76)">
      <rect width="310" height="76" rx="18" fill="#f4c66d18" stroke="#f4c66d88" stroke-width="2"/>
      <path d="M24 22h42v32H24z" fill="#f4c66d22" stroke="#f4c66d" stroke-width="4"/>
      <path d="M38 38h14" stroke="#f4c66d" stroke-width="4" stroke-linecap="round"/>
      <text x="84" y="31" fill="#f4c66d" font-size="16" font-weight="900">金色房框 = 确定配对</text>
      <text x="84" y="55" fill="#d7cfde" font-size="14">两位房客已经入住同一间客房</text>
    </g>
    <g transform="translate(286 166)">
      <rect width="310" height="76" rx="18" fill="#ff826e12" stroke="#ff826e77" stroke-width="2"/>
      <path d="M27 24l36 30m0-30L27 54" stroke="#ff826e" stroke-width="6" stroke-linecap="round"/>
      <text x="84" y="31" fill="#ff9b89" font-size="16" font-weight="900">交叉封条 = 排除配对</text>
      <text x="84" y="55" fill="#d7cfde" font-size="14">记下“这两格不属于同一间房”</text>
    </g>
    <g transform="translate(286 256)">
      <text x="0" y="18" fill="#a9dbd2" font-size="15" font-weight="800">需求数字会在棋盘多次出现</text>
      <g transform="translate(0 30)" font-size="14" font-weight="900" text-anchor="middle">
        <circle cx="22" cy="22" r="19" fill="#f4c66d22" stroke="#f4c66d" stroke-width="3"/><text x="22" y="27" fill="#fff7dc">1</text>
        <path d="M74 3l19 19-19 19-19-19z" fill="#65d5c822" stroke="#65d5c8" stroke-width="3"/><text x="74" y="27" fill="#fff7dc">3</text>
        <text x="118" y="27" fill="#d7cfde" text-anchor="start" font-weight="600">最多同时追踪两种</text>
      </g>
    </g>
  </g>
</svg>
