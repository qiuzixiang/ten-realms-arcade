<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description" data-tutorial-state="action">
  <title id="title">依次选择两个相邻数字格完成配房</title>
  <desc id="description">左侧单独展示先选中数字二，右侧单独展示再选择正交相邻的数字四后形成房框；下方展示配房与排除两个工具。</desc>
  <rect x="8" y="8" width="624" height="344" rx="30" fill="#111830" stroke="#65d5c8" stroke-width="3"/>
  <g font-family="system-ui,sans-serif">
    <text x="38" y="48" fill="#65d5c8" font-size="19" font-weight="900">轻触相邻边，或依次选择两格</text>
    <g transform="translate(38 68)">
      <rect width="244" height="196" rx="22" fill="#ffffff08" stroke="#ffffff24" stroke-width="2"/>
      <text x="22" y="30" fill="#f4c66d" font-size="15" font-weight="900">01 · 先选一格</text>
      <g transform="translate(36 52)" text-anchor="middle" font-size="34" font-weight="900">
        <rect width="78" height="78" rx="16" fill="#1a2340" stroke="#f4c66d" stroke-width="6"/>
        <rect x="92" width="78" height="78" rx="16" fill="#1a2340" stroke="#7b7098" stroke-width="2"/>
        <text x="39" y="52" fill="#fff7dc">2</text><text x="131" y="52" fill="#fff7dc">4</text>
        <path d="M24 92h30l-5 11h-20z" fill="#f4c66d"/>
      </g>
      <text x="22" y="174" fill="#d8d0df" font-size="14">金色角标提示配房起点</text>
    </g>
    <path d="M296 160h42" stroke="#65d5c8" stroke-width="6" stroke-linecap="round"/>
    <path d="M340 160l-14-11v22z" fill="#65d5c8"/>
    <g transform="translate(358 68)">
      <rect width="244" height="196" rx="22" fill="#ffffff08" stroke="#ffffff24" stroke-width="2"/>
      <text x="22" y="30" fill="#65d5c8" font-size="15" font-weight="900">02 · 再选正交相邻格</text>
      <g transform="translate(36 52)" text-anchor="middle" font-size="34" font-weight="900">
        <rect width="78" height="78" rx="16" fill="#1a2340" stroke="#7b7098" stroke-width="2"/>
        <rect x="92" width="78" height="78" rx="16" fill="#1a2340" stroke="#7b7098" stroke-width="2"/>
        <rect x="-6" y="-6" width="182" height="90" rx="22" fill="#f4c66d12" stroke="#f4c66d" stroke-width="7"/>
        <text x="39" y="52" fill="#fff7dc">2</text><text x="131" y="52" fill="#fff7dc">4</text>
        <circle cx="85" cy="39" r="10" fill="#65d5c8" stroke="#111830" stroke-width="3"/>
      </g>
      <text x="22" y="174" fill="#d8d0df" font-size="14">圆角房框不会盖住数字</text>
    </g>
    <g transform="translate(38 282)">
      <rect width="254" height="52" rx="18" fill="#f4c66d1a" stroke="#f4c66d" stroke-width="2"/>
      <path d="M18 13h32v26H18z" fill="none" stroke="#f4c66d" stroke-width="4"/>
      <text x="66" y="32" fill="#fff7dc" font-size="15" font-weight="800">配房：Enter / 点击</text>
    </g>
    <g transform="translate(310 282)">
      <rect width="292" height="52" rx="18" fill="#ff826e12" stroke="#ff826e" stroke-width="2"/>
      <path d="M18 14l30 24m0-24L18 38" stroke="#ff826e" stroke-width="5" stroke-linecap="round"/>
      <text x="66" y="32" fill="#fff7dc" font-size="15" font-weight="800">排除：Space / 右键</text>
    </g>
  </g>
</svg>
