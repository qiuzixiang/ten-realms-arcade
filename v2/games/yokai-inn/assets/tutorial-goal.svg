<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description" data-tutorial-state="goal">
  <title id="title">铺满旅店并让每一种无序数字组合恰好入住一次</title>
  <desc id="description">一个完整的五乘四旅店被十个互不重叠的房框铺满，右侧十种零到三的无序组合全部打勾。</desc>
  <rect x="8" y="8" width="624" height="344" rx="30" fill="#15162d" stroke="#f4c66d" stroke-width="3"/>
  <g font-family="system-ui,sans-serif">
    <text x="32" y="46" fill="#f4c66d" font-size="19" font-weight="900">所有格铺满 · 每种组合一次</text>
