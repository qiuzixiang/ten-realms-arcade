        </g>
      </g>
      <g transform="translate(0 226)">
        <circle cx="22" cy="22" r="20" fill="#f4c66d"/>
        <path d="M12 22l7 7 14-17" fill="none" stroke="#15162d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="55" y="18" fill="#fff7dc" font-size="16" font-weight="900">旅店结账成功</text>
        <text x="55" y="39" fill="#d8d0df" font-size="13">排除线只是笔记，不影响通关</text>
