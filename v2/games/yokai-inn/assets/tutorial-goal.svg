          <text x="12" y="73">✓ 0·2</text><text x="104" y="73">✓ 1·2</text><text x="196" y="73">✓ 2·2</text>
          <text x="12" y="121">✓ 0·3</text><text x="104" y="121">✓ 1·3</text><text x="196" y="121">✓ 2·3</text>
