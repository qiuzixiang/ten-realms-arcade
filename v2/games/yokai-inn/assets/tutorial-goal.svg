      <g fill="#1d2540" stroke="#766d91" stroke-width="1.5">
        <rect x="0" y="0" width="48" height="48" rx="10"/><rect x="52" y="0" width="48" height="48" rx="10"/><rect x="104" y="0" width="48" height="48" rx="10"/><rect x="156" y="0" width="48" height="48" rx="10"/><rect x="208" y="0" width="48" height="48" rx="10"/>
        <rect x="0" y="52" width="48" height="48" rx="10"/><rect x="52" y="52" width="48" height="48" rx="10"/><rect x="104" y="52" width="48" height="48" rx="10"/><rect x="156" y="52" width="48" height="48" rx="10"/><rect x="208" y="52" width="48" height="48" rx="10"/>
        <rect x="0" y="104" width="48" height="48" rx="10"/><rect x="52" y="104" width="48" height="48" rx="10"/><rect x="104" y="104" width="48" height="48" rx="10"/><rect x="156" y="104" width="48" height="48" rx="10"/><rect x="208" y="104" width="48" height="48" rx="10"/>
        <rect x="0" y="156" width="48" height="48" rx="10"/><rect x="52" y="156" width="48" height="48" rx="10"/><rect x="104" y="156" width="48" height="48" rx="10"/><rect x="156" y="156" width="48" height="48" rx="10"/><rect x="208" y="156" width="48" height="48" rx="10"/>
      </g>
      <g fill="#fff7dc">
        <text x="24" y="32">0</text><text x="76" y="32">2</text><text x="128" y="32">2</text><text x="180" y="32">3</text><text x="232" y="32">0</text>
        <text x="24" y="84">1</text><text x="76" y="84">3</text><text x="128" y="84">0</text><text x="180" y="84">0</text><text x="232" y="84">1</text>
        <text x="24" y="136">1</text><text x="76" y="136">3</text><text x="128" y="136">3</text><text x="180" y="136">3</text><text x="232" y="136">1</text>
        <text x="24" y="188">2</text><text x="76" y="188">0</text><text x="128" y="188">2</text><text x="180" y="188">2</text><text x="232" y="188">1</text>
      </g>
      <g fill="#f4c66d10" stroke="#f4c66d" stroke-width="4">
        <rect x="-4" y="-4" width="108" height="56" rx="14"/><rect x="100" y="-4" width="108" height="56" rx="14"/>
        <rect x="204" y="-4" width="56" height="108" rx="14"/><rect x="-4" y="48" width="108" height="56" rx="14"/>
        <rect x="100" y="48" width="108" height="56" rx="14"/><rect x="-4" y="100" width="56" height="108" rx="14"/>
        <rect x="48" y="100" width="56" height="108" rx="14"/><rect x="100" y="100" width="108" height="56" rx="14"/>
        <rect x="204" y="100" width="56" height="108" rx="14"/><rect x="100" y="152" width="108" height="56" rx="14"/>
      </g>
    </g>
    <g transform="translate(326 74)">
      <text x="0" y="0" fill="#65d5c8" font-size="15" font-weight="900">完整 0..3 住客组合</text>
      <g transform="translate(0 20)" font-size="14" font-weight="800">
        <g fill="#65d5c820" stroke="#65d5c8" stroke-width="2">
          <rect x="0" y="0" width="82" height="38" rx="12"/><rect x="92" y="0" width="82" height="38" rx="12"/><rect x="184" y="0" width="82" height="38" rx="12"/>
          <rect x="0" y="48" width="82" height="38" rx="12"/><rect x="92" y="48" width="82" height="38" rx="12"/><rect x="184" y="48" width="82" height="38" rx="12"/>
          <rect x="0" y="96" width="82" height="38" rx="12"/><rect x="92" y="96" width="82" height="38" rx="12"/><rect x="184" y="96" width="82" height="38" rx="12"/>
